syntax = "proto3";

package common;

enum DisclosedBase {
  DISCLOSED_BASE_H = 0;
  DISCLOSED_BASE_V = 1;
  DISCLOSED_BASE_D = 2;
  DISCLOSED_BASE_A = 3;
}

message DisclosedTag {
  DisclosedBase base = 1;
  uint64 time = 2;
}

message Empty {}

message BitVecDto {
  bytes bytes = 1;
  uint64 bit_len = 2;
}