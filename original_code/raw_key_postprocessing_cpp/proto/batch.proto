syntax = "proto3";

package batch;

import "common.proto";

service BatchService {
  rpc Subscribe(common.Empty) returns
    (stream Batches) {}
}

message Batches {
  Batch tags_client = 1;
  Batch tags_server = 2;
  common.BitVecDto sifted_key_client = 3;
  common.BitVecDto sifted_key_server = 4;
}


message Batch {
  uint64 batch_id = 1;
  repeated common.DisclosedTag tags = 2;
}
