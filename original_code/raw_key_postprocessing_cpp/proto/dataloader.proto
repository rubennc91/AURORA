syntax = "proto3";

package dataloader;

service DataLoader {
    rpc ConsumeTags(ConsumeRequest) returns (stream TagBatch) {}
    // List devices, frontends
    // Configure devices, frontends
}

message ConsumeRequest {
    string processor_name = 1;
}

enum State {
    INVALID_OR_UNKNOWN = 0;
    H = 1;
    V = 2;
    D = 3;
    A = 4;
}

message Tag {
    uint64 timestamp = 1;
    State state = 2;
}

message TagBatch {
    repeated Tag tags = 1;
    uint64 last_sync_time = 2; // start sync once last sync time is not 0 and laser is on.
    bool laser_on = 3;
    uint64 zero_timestamp_ms = 4;  
}
