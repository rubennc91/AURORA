name: tests

on:
  push:
  pull_request:

jobs:
  pc-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy + Icarus Verilog
        run: |
          pip install numpy
          sudo apt-get update && sudo apt-get install -y iverilog
      - name: Build
        run: make
      - name: Kernels nuevos + validacion sobre batches reales
        run: make test
      - name: Fallos documentados del codigo anterior (XFAIL)
        run: make test-legacy
      - name: TRNG (simulacion RTL)
        run: make test-trng test-heater
      - name: Aplicacion bare-metal (plataforma simulada)
        run: make test-baremetal
      - name: Pipeline completo
        run: make pipeline
